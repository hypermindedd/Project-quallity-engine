# Add this file to any repository as .github/workflows/pqe.yml — that is all.
# The engine detects what the project is (site, web app, API, Android, iOS, Flutter,
# React Native, CLI, library, …), designs the tests, runs them and reports.
#
# One-time setup in the ENGINE repository (hypermindedd/pqe01-project-quality-engine):
#   Settings → Actions → General → Access → "Accessible from repositories owned by the user".
# Optional secrets in the PROJECT repository: ANTHROPIC_API_KEY (AI test designer and
# visual review), NOTION_TOKEN (command-room report).
name: Project Quality Engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    uses: hypermindedd/pqe01-project-quality-engine/.github/workflows/pqe.yml@main
    with:
      fail-on: no_go   # use "never" for report-only while the project is young
    secrets: inherit
