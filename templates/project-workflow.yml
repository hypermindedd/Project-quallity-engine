# Add this file to any repository as .github/workflows/pqe.yml — that is all.
# The engine detects what the project is (site, web app, API, Android, iOS, Flutter,
# React Native, CLI, library, …), designs the tests, runs them and reports.
#
# Optional secrets in the PROJECT repository:
#   ANTHROPIC_API_KEY  AI test designer (goals and journeys from your documents) + visual review
#   NOTION_TOKEN       command-room report
name: Project Quality Engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    uses: hypermindedd/Project-quallity-engine/.github/workflows/pqe.yml@main
    with:
      fail-on: never   # report only while the project is young; switch to no_go to block bad releases
    secrets: inherit
