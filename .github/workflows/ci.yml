name: PQE engine CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install engine with all extras
        run: python -m pip install -e '.[dev,security,ui]'
      - name: Install Chromium for the browser runner
        run: python -m playwright install --with-deps chromium
      - name: Prepare accessibility and database regression fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/pqe-a11y" --no-save --ignore-scripts axe-core@4.11.4
          echo "PQE_AXE_TEST_SOURCE=$RUNNER_TEMP/pqe-a11y/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check src tests
      - name: Self-tests (includes real browser and HTTP runs)
        run: python -m pytest -q
      - name: Autonomous smoke run on every fixture kind (plan only)
        run: for d in tests/fixtures/projects/*/; do pqe plan "$d" --json > /dev/null; done
      - name: Validate Claude Code plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./plugin
          claude plugin validate .
