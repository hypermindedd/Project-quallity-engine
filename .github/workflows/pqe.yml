# Reusable workflow: any repository of the same owner calls it with ~10 lines
# (see templates/project-workflow.yml). It classifies the project and fans out
# to one job per environment the project actually needs.
name: PQE quality run

on:
  workflow_call:
    inputs:
      ai:
        type: boolean
        default: true
      fail-on:
        type: string
        default: no_go
      android-api-level:
        type: number
        default: 34
      monkey-events:
        type: number
        default: 5000
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      NOTION_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      kinds: ${{ steps.pqe.outputs.kinds }}
      has_android: ${{ steps.pqe.outputs.has_android }}
      has_ios: ${{ steps.pqe.outputs.has_ios }}
      has_windows: ${{ steps.pqe.outputs.has_windows }}
    steps:
      - uses: actions/checkout@v4
      - id: pqe
        uses: hypermindedd/pqe01-project-quality-engine@main
        with:
          mode: classify

  web:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hypermindedd/pqe01-project-quality-engine@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        with:
          target: web
          ai: ${{ inputs.ai }}
          fail-on: ${{ inputs.fail-on }}
          out: pqe-report-web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqe-report-web
          path: |
            pqe-report-web/
            .qa/pqe.toml
            .qa/plan.md
            .qa/planner.json
            .qa/classification.json
      - if: always() && hashFiles('pqe-report-web/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pqe-report-web/results.sarif
          category: pqe-web

  android:
    needs: classify
    if: needs.classify.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: contains(needs.classify.outputs.kinds, 'flutter_app')
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: hashFiles('**/.maestro/**') != ''
        name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: hypermindedd/pqe01-project-quality-engine@main
        with:
          mode: install
      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PQE_MONKEY_EVENTS: ${{ inputs.monkey-events }}
        with:
          api-level: ${{ inputs.android-api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: pqe auto . --target android --no-ai --out pqe-report-android --fail-on ${{ inputs.fail-on }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqe-report-android
          path: pqe-report-android/

  ios:
    needs: classify
    if: needs.classify.outputs.has_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: hypermindedd/pqe01-project-quality-engine@main
        with:
          target: ios
          ai: false
          fail-on: ${{ inputs.fail-on }}
          out: pqe-report-ios
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqe-report-ios
          path: pqe-report-ios/

  windows-note:
    needs: classify
    if: needs.classify.outputs.has_windows == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::MQL5 Expert Advisors need MetaTrader 5 (Windows) to compile and backtest; hosted runners cannot do this. See .qa/plan.md."
