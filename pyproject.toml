[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqe"
version = "0.1.0"
description = "PQE.01 — Project Quality Engine: goal-traced, architecture-aware automated QA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "A.del" }]
dependencies = []

[project.optional-dependencies]
security = ["bandit>=1.8", "pip-audit>=2.9", "ruff>=0.14"]
ui = ["playwright>=1.55", "pillow>=11"]
all = ["pqe[security,ui]", "semgrep>=1.140"]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
pqe = "pqe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/pqe/model.py" = ["S105"]   # enum values such as PASS are not passwords
"src/pqe/config.py" = ["S105"]  # names of environment variables, not secrets
